<title>自选信号</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1a1a1a;padding:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
.head{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:19px;font-weight:600;margin-bottom:8px}
.meta{font-size:13px;color:#666;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.bull{background:#fde8e8;color:#c0392b}
.bear{background:#e8f5e9;color:#2e7d32}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{padding:6px 14px;border-radius:6px;background:#fff;border:1px solid #e0e0e0;cursor:pointer;font-size:13px;color:#666}
.tab.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.stats{display:flex;gap:16px;font-size:13px;color:#666;margin-bottom:12px;padding:0 4px}
.stats b{font-size:15px}
.card{background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.row{display:grid;grid-template-columns:1.5fr 0.8fr 0.7fr 0.7fr 0.8fr 0.8fr 0.7fr;gap:8px;padding:12px 14px;align-items:center;font-size:13px;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:none}
.row.hd{background:#fafafa;color:#888;font-size:12px;font-weight:500;padding:8px 14px}
.name{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.code{font-size:11px;color:#999;font-weight:400}
.px{font-variant-numeric:tabular-nums;font-weight:500}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:500}
.t-buy{background:#fde8e8;color:#c0392b}
.t-sell{background:#e8f5e9;color:#2e7d32}
.t-wait{background:#f0f0f0;color:#888}
.num{font-variant-numeric:tabular-nums;color:#555}
.rule{font-size:11px;color:#999;grid-column:1/-1;margin-top:-4px;padding-bottom:2px}
.up{color:#c0392b}.down{color:#2e7d32}
@media(max-width:720px){
 .row{grid-template-columns:1.6fr 0.8fr 0.7fr 0.9fr;font-size:12px;padding:10px 12px}
 .row.hd{display:none}
 .hide-m{display:none}
 .rule{grid-column:1/-1}
}
.foot{text-align:center;font-size:11px;color:#aaa;padding:20px 0}
</style>
</head>

function fmt(n, d){
  if(n === null || n === undefined || isNaN(n)) return '—';
  if(d === undefined) d = (Math.abs(Number(n)) < 10 && !Number.isInteger(Number(n))) ? 3 : 2;
  return Number(n).toFixed(d);
}

let CUR = null;

function render(){
  const D = SNAP;
  if(!D || !D.slots) return;

  document.getElementById('date').textContent = D.date || '';
  const m = D.market || {};
  document.getElementById('idx').innerHTML =
    '沪深300 ' + fmt(m.idx, 1) + ' · MA60 ' + fmt(m.ma60, 1) +
    ' <span class="badge ' + (m.bull ? 'bull' : 'bear') + '">' +
    (m.bull ? '多头' : '空头') + '</span>';
  document.getElementById('upd').textContent = '更新 ' + (D.updated || '');

  const keys = Object.keys(D.slots);
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = keys.map(k => {
    const s = D.slots[k];
    return '<div class="tab' + (k === CUR ? ' on' : '') + '" data-k="' + k + '">' +
      s.label + ' ' + s.ts + '</div>';
  }).join('');
  tabs.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { CUR = el.dataset.k; render(); };
  });

  const slot = D.slots[CUR];
  if(!slot) return;
  const c = slot.counts || {};

  document.getElementById('stats').innerHTML =
    '<span>买入 <b style="color:#c0392b">' + (c.buy || 0) + '</b></span>' +
    '<span>卖出 <b style="color:#2e7d32">' + (c.sell || 0) + '</b></span>' +
    '<span>等待 <b style="color:#888">' + (c.wait || 0) + '</b></span>' +
    '<span style="color:#aaa">共 ' + slot.rows.length + ' 只</span>';

  const rows = slot.rows.slice().sort((a, b) => {
    const order = { buy: 0, sell: 1, wait: 2 };
    return (order[a.status] ?? 3) - (order[b.status] ?? 3);
  });

  const tagOf = st =>
    st === 'buy'  ? '<span class="tag t-buy">买入</span>' :
    st === 'sell' ? '<span class="tag t-sell">卖出</span>' :
                    '<span class="tag t-wait">等待</span>';

  let html =
    '<div class="card"><div class="row hd">' +
    '<div>名称</div><div>现价</div><div>RSI14</div><div>BIAS6</div>' +
    '<div class="hide-m">买点</div><div class="hide-m">卖点</div><div>信号</div></div>';

  rows.forEach(r => {
    const d5 = (r.d5 === null || r.d5 === undefined) ? null : Number(r.d5);
    const d5cls = d5 === null ? '' : (d5 > 0 ? 'up' : (d5 < 0 ? 'down' : ''));
    html +=
      '<div class="row">' +
        '<div class="name">' + r.name + '<span class="code">' + r.code + '</span></div>' +
        '<div class="px">' + fmt(r.price) + '</div>' +
        '<div class="num">' + fmt(r.rsi, 1) + '</div>' +
        '<div class="num ' + (r.bias6 > 0 ? 'up' : 'down') + '">' +
          (r.bias6 > 0 ? '+' : '') + fmt(r.bias6, 2) + '%</div>' +
        '<div class="num hide-m">' + fmt(r.buy) + '</div>' +
        '<div class="num hide-m">' + fmt(r.sell) + '</div>' +
        '<div>' + tagOf(r.status) + '</div>' +
        '<div class="rule">买 ' + r.buy_rule + ' ｜ 卖 ' + r.sell_rule + '</div>' +
      '</div>';
  });

  html += '</div>';
  document.getElementById('list').innerHTML = html;
}

render();
