name: 每日急跌稳股筛选

on:
  schedule:
    # 北京时间 16:30（收盘后），UTC 08:30。晚于信号收盘档，避开排队
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-update
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行筛选
        run: python ci/daily_scan.py
      - name: 生成页面
        run: python build_scan.py
      - name: 提交并推送
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add scan_data.json scan.html
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "scan $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
