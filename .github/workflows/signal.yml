name: 每日信号更新

on:
  schedule:
    # 北京时间 = UTC+8，中国无夏令时。盘中每 15 分钟扫一次，一触发就推微信。
    # 09:30-11:30 北京 = 01:30-03:30 UTC；13:00-15:00 北京 = 05:00-07:00 UTC。
    # 用 */15 覆盖交易时段，边缘的 09:00/11:45/15:00 非交易时点由脚本内部跳过推送。
    - cron: "*/15 1-3 * * 1-5"
    - cron: "*/15 5-6 * * 1-5"
    # 北京时间 15:05（收盘确认）。UTC 07:05
    - cron: "5 7 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "档位：live 手动刷新(不推) / intraday 盘中(推) / 1505 收盘(推)"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - intraday
          - "1505"
      force:
        description: "覆盖当天已抓到的同档数据"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判定档位
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 用触发本次任务的 cron 表达式判定，而不是用运行时刻反推：
            # Actions 定时任务常延迟 5~40 分钟，反推会把盘中数据标错档。
            # github.event.schedule 就是触发这次的 cron 原文。
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" = "5 7 * * 1-5" ]; then
              SLOT=1505
            else
              SLOT=intraday
            fi
          else
            SLOT="${{ github.event.inputs.slot }}"
          fi
          FORCE="${{ github.event.inputs.force }}"
          [ "$FORCE" = "true" ] || FORCE=0
          echo "SLOT=$SLOT" >> $GITHUB_ENV
          echo "FORCE=$FORCE" >> $GITHUB_ENV
          echo "档位=$SLOT force=$FORCE cron=${{ github.event.schedule }}"

      - name: 抓取数据
        run: python ci/update_ci.py

      - name: 生成页面
        run: python build_site.py

      # intraday（盘中）与 1505（收盘）两个档推送；live 档（手动刷新、补跑）
      # 以及非交易时点的盘中档，由 notify.py 内部跳过。没配 secret 时只打 warning。
      - name: 推送提醒
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: python ci/notify.py

      - name: 提交并推送
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data.json index.html
          [ -f notify_state.json ] && git add notify_state.json
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') [$SLOT]"
            git push
          fi
