name: 盘中信号更新

on:
  schedule:
    # UTC 06:51 = 北京 14:51（盘中）
    - cron: "51 6 * * 1-5"
    # UTC 07:05 = 北京 15:05（收盘）
    - cron: "5 7 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "档位：live / 1451 / 1505"
        required: false
        default: "live"

permissions:
  contents: write

concurrency:
  group: signal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判定档位
        id: slot
        run: |
          MANUAL="${{ github.event.inputs.slot }}"
          if [ -n "$MANUAL" ]; then
            SLOT="$MANUAL"
          else
            HM=$(TZ=Asia/Shanghai date +%H%M)
            if [ "$HM" -ge 1500 ]; then SLOT=1505; else SLOT=1451; fi
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "档位: $SLOT"

      - name: 抓取数据
        env:
          MANUAL_SLOT: ${{ steps.slot.outputs.slot }}
        run: python ci/update_ci.py

      - name: 生成页面
        run: python build_site.py

      - name: 提交并推送
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') [${{ steps.slot.outputs.slot }}]"
            git push
          fi
